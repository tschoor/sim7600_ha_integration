name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Lint, Type Check, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          # Install integration requirements from manifest
          pip install $(jq -r '.requirements | .[]' custom_components/sim7600/manifest.json)

      - name: Ruff Check
        run: ruff check .

      - name: Ruff Format Check
        run: ruff format --check .

      - name: Mypy Check
        run: mypy custom_components/sim7600

      - name: Vulnerability Check
        run: safety check

      - name: License Check
        run: pip-licenses --summary --fail-on-bad-license --allow-only "MIT;Apache-2.0;BSD-3-Clause;BSD-2-Clause;Python-2.0;LGPL-2.1;LGPL-3.0;MPL-2.0"

      - name: Run Tests
        run: pytest

  snapshot:
    name: Create Snapshot Release
    needs: test
    if: |
      success() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Snapshot Version
        id: versioning
        run: |
          BASE_VERSION=$(jq -r '.version' custom_components/sim7600/manifest.json)
          SHORT_SHA=$(git rev-parse --short HEAD)
          SNAPSHOT_VERSION="${BASE_VERSION}-dev.${SHORT_SHA}"
          echo "snapshot_version=${SNAPSHOT_VERSION}" >> $GITHUB_OUTPUT
          
          # Update manifest.json
          jq ".version = \"${SNAPSHOT_VERSION}\"" custom_components/sim7600/manifest.json > manifest.json.tmp
          mv manifest.json.tmp custom_components/sim7600/manifest.json

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Tag and Push
        run: |
          VERSION=${{ steps.versioning.outputs.snapshot_version }}
          git add custom_components/sim7600/manifest.json
          git commit -m "chore: bump snapshot version to ${VERSION}"
          git tag ${VERSION}
          git push origin ${VERSION}
          git push origin HEAD:${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.snapshot_version }}
          name: Snapshot ${{ steps.versioning.outputs.snapshot_version }}
          prerelease: true
          generate_release_notes: true
